name: scratch-test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p credence_registry --locked events_schema
      - run: cargo test -p credence_registry --locked
      - run: cargo clippy -p credence_registry --all-targets --locked -- -D warnings
      - run: python3 scripts/check_no_panic.py
